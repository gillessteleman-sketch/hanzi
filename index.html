async function authenticate(e){e.preventDefault();if(!db||busy)return;unlockAudio();busy=true;const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;try{let password=document.getElementById('password').value;let r;if(recovery){r=await db.auth.updateUser({password});if(r.error)throw r.error;recovery=false;await activate(r.data.user);return}let email=document.getElementById('email').value.trim();if(authMode==='signup'){r=await db.auth.signUp({email,password,options:{data:{name:document.getElementById('name').value.trim()},emailRedirectTo:SITE}});if(r.error)throw r.error;if(!r.data.session){notice('Controleer je e-mail om je registratie te bevestigen.');return}}else{r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error}showSplash();await activate(r.data.user)}catch(e){notice(e.message||'Inloggen mislukt.')}finally{busy=false;btn.disabled=false}}
async function forgot(){if(!db||busy)return;let email=document.getElementById('email')?.value.trim();if(!email){notice('Vul eerst je e-mailadres in.');return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:SITE});notice(error?error.message:'Als dit account bestaat, ontvang je een herstelmail.');}
async function activate(u){let token=++epoch;user=u;ready=false;saved={};lastSync=null;syncError="";syncState="busy";if(!u)hideSplash();pool=[];pos=0;revealed=false;lesson=0;query='';filter='all';tab='home';render();if(!u)return;await refresh(token);}
async function refresh(token=epoch){if(!user||recovery)return;let uid=user.id;cloud("busy");try{const {data,error}=await db.from('study_progress').select('hanzi,recognize,pronounce,writing').eq('user_id',uid);if(error)throw error;if(token!==epoch||uid!==user?.id)return;let next={};for(const r of data){let i=DATA.findIndex(d=>d[1]===r.hanzi);if(i>=0)next[i]=[r.recognize,r.pronounce,r.writing]}saved=next;ready=true;cloud("ok");render()}catch(e){if(token!==epoch)return;ready=false;saved={};cloud("error",e.message);render();notice('Voortgang laden mislukt: '+e.message)}}

async function set(i,k,v){if(!ready||busy||!user)return false;busy=true;let uid=user.id,token=epoch;cloud("busy");try{let {error}=await db.from('study_progress').upsert({user_id:uid,hanzi:DATA[i][1],[cols[k]]:v,updated_at:new Date().toISOString()},{onConflict:'user_id,hanzi',defaultToNull:false});if(error)throw error;if(token!==epoch)return false;let a=[...get(i)];a[k]=v;saved[i]=a;cloud("ok");return true}catch(e){if(token===epoch)cloud("error",e.message);alert('Niet opgeslagen: '+e.message);return false}finally{busy=false;paintCloud()}}
async function wipe(){if(busy||!ready||!confirm('Alle voortgang van dit account wissen?'))return;busy=true;try{let {error}=await db.from('study_progress').delete().eq('user_id',user.id);if(error)throw error;await refresh()}catch(e){alert(e.message)}finally{busy=false}}
let tab='home',lesson=0,query='',filter='all',mode='recognize',pool=[],pos=0,revealed=false;const app=document.getElementById('app');const skills=['Herkennen','Uitspreken','Schrijven'];const statuses=['Niet getest','Nog niet','In oefening','Beheerst'];const id=i=>String(i);const get=i=>saved[id(i)]||[0,0,0];const mastered=i=>get(i).every(x=>x===3);const count=(ids,k)=>ids.filter(i=>k===undefined?mastered(i):get(i)[k]===3).length;const all=DATA.map((_,i)=>i);const pct=(n,d)=>d?Math.round(n/d*100):0;const bar=(n,d)=>`<div class="bar"><i style="width:${pct(n,d)}%"></i></div>`;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function greeting(){const h=new Date().getHours();return (h<6?'Goedenacht':h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond')+' '+(user?.user_metadata?.name||'');}function refreshGreeting(){const el=document.getElementById('greeting');if(el)el.textContent=greeting();}function go(t){tab=t;render();window.scrollTo(0,0)}function render(){paintCloud();if(recovery||!user){profileScreen();return}document.body.classList.remove('auth-page');if(!ready){document.getElementById('nav').style.display='none';app.innerHTML='<section class="card"><h2>Voortgang laden</h2><p id="notice"></p><button onclick="refresh()">Opnieuw laden</button> <button onclick="logout()">Uitloggen</button></section>';return}document.getElementById('nav').style.display='';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home'){let n=count(all);app.innerHTML=`<div class="greeting"><h2 id="greeting">${esc(greeting())}</h2><p>Klaar om verder Chinees te leren?</p></div><section class="card hero"><small>KARAKTERS · VOLLEDIG BEHEERST</small><div class="row"><div class="big">${n} / ${DATA.length}</div><strong>${pct(n,DATA.length)}%</strong></div>${bar(n,DATA.length)}<div class="stats">${skills.map((s,k)=>`<div><strong>${count(all,k)}</strong><small>${s}</small></div>`).join('')}</div></section><div class="quickgrid"><button onclick="go('learn')"><strong>课程 · Mijn cursus</strong><small>15 units bekijken</small></button><button onclick="go('practice')"><strong>练习 · Oefenen</strong><small>Start een oefenronde</small></button><button onclick="lesson=0;query='';filter='all';go('lessons')"><strong>汉字 · Karakters</strong><small>Alle schrijfkarakters</small></button><button onclick="go('settings')"><strong>Mijn profiel</strong><small>Cloud en instellingen</small></button></div><h2>Schrijflessen</h2>`+Array.from({length:12},(_,k)=>{let l=k+1,ids=all.filter(i=>DATA[i][0]===l),n=count(ids);return `<button class="lesson" onclick="lesson=${l};query='';filter='all';go('lessons')"><div class="row"><strong>Les ${l}</strong><small>${n}/${ids.length}</small></div><div style="font-size:24px;margin-top:8px">${ids.slice(0,7).map(i=>DATA[i][1]).join(' ')}</div>${bar(n,ids.length)}</button>`}).join('');}else if(tab==='lessons'){app.innerHTML=`<h2>Karakters</h2><div class="filters"><input id="search" placeholder="Zoek Hanzi, pinyin of Engels" value="${esc(query)}"><select id="lesson"><option value="0">Alle lessen</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${lesson===i+1?'selected':''}>Les ${i+1}</option>`).join('')}</select><select id="filter"><option value="all">Alle statussen</option><option value="todo" ${filter==='todo'?'selected':''}>Nog te leren</option><option value="done" ${filter==='done'?'selected':''}>Beheerst</option></select></div><div id="results"></div>`;document.getElementById('search').oninput=e=>{query=e.target.value;list()};document.getElementById('lesson').onchange=e=>{lesson=+e.target.value;list()};document.getElementById('filter').onchange=e=>{filter=e.target.value;list()};list();}else if(tab==='practice'){practice()}else if(tab==='learn'){learn()}else{app.innerHTML=`<h2>Instellingen</h2><section class="card"><h3>Mijn profiel</h3><p>${esc(user?.user_metadata?.name||'')}</p><button onclick="renameProfile()">Naam wijzigen</button> <button onclick="logout()">Uitloggen</button><p class="hint">Je account is gekoppeld aan Supabase.</p></section><section class="card"><h3>Cloudopslag & synchronisatie</h3><p>Supabase · ${esc(user.email||'')}</p><p>${Object.keys(saved).length} opgeslagen karakterrecords · ${lastSync?lastSync.toLocaleString('nl-BE'):'Nog niet gesynchroniseerd'}</p><button onclick="manualSync()">Synchroniseer nu</button><p class="hint">Wijzigingen worden direct online opgeslagen. Er is geen offline wachtrij.</p></section><section class="card"><h3>Geluid</h3><label><input type="checkbox" ${localStorage.getItem('hanzi-jingle')!=='off'?'checked':''} onchange="localStorage.setItem('hanzi-jingle',this.checked?'on':'off')"> Startjingle</label></section><section class="card"><h3>Je voortgang</h3><p>Je resultaten worden online opgeslagen. Exporteer een reservekopie indien gewenst.</p><button onclick="backup()">Exporteer voortgang</button><p><label>Importeer reservekopie <input type="file" accept="application/json" onchange="restore(event)"></label></p><button onclick="wipe()">Wis voortgang</button></section><p class="hint">Versie 3.0 · Foundation · Gebaseerd op je Excel-tracker. Uitspraak gebruikt de stemmen van je browser.</p>`}}
async function changeSkill(el,i,k){el.disabled=true;let ok=await set(i,k,+el.value);el.disabled=false;el.value=get(i)[k];el.dataset.status=el.value;if(ok&&filter!=='all')list()}function list(){let q=query.toLowerCase().trim(),ids=all.filter(i=>(!lesson||DATA[i][0]===lesson)&&(!q||DATA[i].slice(1).join(' ').toLowerCase().includes(q))&&(filter==='all'||(filter==='done'?mastered(i):!mastered(i))));document.getElementById('results').innerHTML=`<p class="muted">${ids.length} karakters</p>`+ids.map(i=>{let [l,h,p,m]=DATA[i];return `<section class="card"><div class="row"><div><span class="han">${h}</span> <strong>${esc(p)}</strong><div class="muted">${esc(m)}</div></div><button class="iconbtn" onclick="speak(${i})" aria-label="Uitspraak afspelen">${SPEAKER_ICON}<span>Uitspraak afspelen</span></button></div><small>Les ${l}</small>${skills.map((s,k)=>`<div class="skill"><small>${s}</small><select aria-label="${s}" data-status="${get(i)[k]}" style="width:100%" onchange="changeSkill(this,${i},${k})">${statuses.map((x,v)=>`<option value="${v}" ${get(i)[k]===v?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}</section>`}).join('')}
function speak(i){if(!('speechSynthesis' in window)){alert('Uitspraak is niet beschikbaar.');return}let u=new SpeechSynthesisUtterance(DATA[i][1]);u.lang='zh-CN';u.rate=.8;let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('zh-cn'));if(voice)u.voice=voice;speechSynthesis.cancel();speechSynthesis.speak(u)}
function start(){mode=document.getElementById('mode').value;let l=+document.getElementById('pl').value,only=document.getElementById('only').checked,k=mode==='recognize'?0:mode==='pronounce'?1:2;pool=all.filter(i=>(!l||DATA[i][0]===l)&&(!only||get(i)[k]!==3));for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}pos=0;revealed=false;practice()}
function practice(){if(!pool.length||pos>=pool.length){app.innerHTML=`<h2>${pool.length?'Ronde voltooid!':'Oefenen'}</h2><section class="card"><p>Kies wat je wilt oefenen.</p><select id="mode" style="width:100%"><option value="recognize">Herkennen · Hanzi → betekenis</option><option value="pronounce">Uitspreken · Hanzi → pinyin</option><option value="write">Schrijven · betekenis → Hanzi</option></select><p><select id="pl" style="width:100%"><option value="0">Alle lessen</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}">Les ${i+1}</option>`).join('')}</select></p><p><label><input id="only" type="checkbox" checked> Alleen nog niet beheerste karakters</label></p><button class="active" onclick="start()">Start oefenronde</button></section>`;return}let i=pool[pos],[l,h,p,m]=DATA[i];app.innerHTML=`<div class="row"><small>${pos+1} / ${pool.length} · Les ${l}</small><button onclick="pool=[];practice()">Stop</button></div>${bar(pos,pool.length)}<section class="card practice"><small>${mode==='write'?'Schrijf het karakter':mode==='pronounce'?'Wat is de pinyin?':'Wat betekent dit?'}</small>${mode==='write'?`<h2>${esc(m)}</h2><p>${esc(p)}</p><div class="canvaswrap"><canvas id="pad" width="640" height="640"></canvas></div><button onclick="clearPad()">Wis schrijfvlak</button>`:`<div class="han">${h}</div>`}<div id="answer" ${revealed?'':'class="hidden"'}><div class="han" style="font-size:60px">${h}</div><h2>${esc(p)}</h2><p>${esc(m)}</p><button class="iconbtn" onclick="speak(${i})" aria-label="Luister naar uitspraak">${SPEAKER_ICON}<span>Luister naar uitspraak</span></button></div><div id="rating" ${revealed?'':'class="hidden"'}><p>Hoe goed kende je het?</p><button onclick="rate(1)">Nog niet</button><button onclick="rate(2)">Bijna</button><button class="active" onclick="rate(3)">Beheerst</button></div><button id="reveal" class="active ${revealed?'hidden':''}" onclick="revealed=true;document.getElementById('answer').classList.remove('hidden');document.getElementById('rating').classList.remove('hidden');this.classList.add('hidden')">Toon antwoord</button></section><p class="hint">Beoordeel jezelf na het bekijken van het antwoord. Schrijftraining wordt niet automatisch gecorrigeerd.</p>`;if(mode==='write')initPad()}
async function rate(v){if(!await set(pool[pos],mode==='recognize'?0:mode==='pronounce'?1:2,v))return;pos++;revealed=false;practice()}function clearPad(){let c=document.getElementById('pad'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.strokeStyle='#c9cec5';x.lineWidth=2;x.setLineDash([9,9]);x.beginPath();x.moveTo(320,0);x.lineTo(320,640);x.moveTo(0,320);x.lineTo(640,320);x.stroke();x.setLineDash([])}function initPad(){let c=document.getElementById('pad'),x=c.getContext('2d'),down=false;clearPad();function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*640/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);x.strokeStyle='#17291f';x.lineWidth=12;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(...point(e));x.lineTo(...point(e));x.stroke()};c.onpointermove=e=>{if(down){x.lineTo(...point(e));x.stroke()}};c.onpointerup=c.onpointercancel=()=>down=false}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(saved)],{type:'application/json'}));a.download='hanzi-voortgang.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(e){try{let d=JSON.parse(await e.target.files[0].text());if(!d||Array.isArray(d)||typeof d!=='object'||!Object.entries(d).every(([k,v])=>/^\d+$/.test(k)&&+k<DATA.length&&Array.isArray(v)&&v.length===3&&v.every(n=>Number.isInteger(n)&&n>=0&&n<=3)))throw Error();if(!ready||busy||!confirm('Importeer deze reservekopie in je huidige account? Bestaande waarden voor deze karakters worden vervangen.'))return;busy=true;try{let rows=Object.entries(d).map(([k,v])=>({user_id:user.id,hanzi:DATA[+k][1],recognize:v[0],pronounce:v[1],writing:v[2],updated_at:new Date().toISOString()}));if(rows.length){let {error}=await db.from('study_progress').upsert(rows,{onConflict:'user_id,hanzi'});if(error)throw error}await refresh();alert('Voortgang geïmporteerd.')}finally{busy=false}}catch(e){alert('Import </script></body></html>
