le"], [11, "爱", "ài", "to love"], [11, "些", "xiē", "a bunch, a few"], [11, "水", "shuǐ", "water"], [11, "果", "guǒ", "fruit, result"], [11, "身", "shēn", "body, identity"], [11, "体", "tǐ", "body"], [12, "喂", "wèi/wéi", "hello"], [12, "苹", "píng", "apple"], [12, "东", "dōng", "east"], [12, "南", "nán", "south"], [12, "西", "xī", "west"], [12, "北", "běi", "north"], [12, "见", "jiàn", "to see"], [12, "张", "zhāng", "surname"], [12, "衣", "yī", "clothes"], [12, "服", "fú", "clothes, to obey"], [12, "认", "rèn", "to recognise"], [12, "识", "shí", "to know, understand"], [12, "租", "zū", "to rent"], [12, "飞", "fēi", "to fly"], [12, "机", "jī", "machine, chance, opportunity"]];const KEY='hanzi-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}let tab='home',lesson=0,query='',filter='all',mode='recognize',pool=[],pos=0,revealed=false;const app=document.getElementById('app');const skills=['Herkennen','Uitspreken','Schrijven'];const statuses=['Niet getest','Nog niet','In oefening','Beheerst'];const id=i=>String(i);const get=i=>saved[id(i)]||[0,0,0];const mastered=i=>get(i).every(x=>x===3);const count=(ids,k)=>ids.filter(i=>k===undefined?mastered(i):get(i)[k]===3).length;const all=DATA.map((_,i)=>i);const pct=(n,d)=>d?Math.round(n/d*100):0;const bar=(n,d)=>`<div class="bar"><i style="width:${pct(n,d)}%"></i></div>`;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function set(i,k,v){let a=[...get(i)];a[k]=v;saved[id(i)]=a;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){alert('Opslaan is niet beschikbaar in deze browser.')} }function greeting(){const h=new Date().getHours();return (h<6?'Goedenacht':h<12?'Goedemorgen':h<18?'Goedemiddag':'Goedenavond')+' Gilles';}function refreshGreeting(){const el=document.getElementById('greeting');if(el)el.textContent=greeting();}function go(t){tab=t;render();window.scrollTo(0,0)}function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='home'){let n=count(all);app.innerHTML=`<div class="greeting"><h2 id="greeting">${greeting()}</h2><p>Klaar om verder Chinees te leren?</p></div><section class="card"><small>VOLLEDIG BEHEERST</small><div class="row"><div class="big">${n} / ${DATA.length}</div><strong>${pct(n,DATA.length)}%</strong></div>${bar(n,DATA.length)}<div class="stats">${skills.map((s,k)=>`<div><strong>${count(all,k)}</strong><small>${s}</small></div>`).join('')}</div></section><h2>Mijn lessen</h2>`+Array.from({length:12},(_,k)=>{let l=k+1,ids=all.filter(i=>DATA[i][0]===l),n=count(ids);return `<button class="lesson" onclick="lesson=${l};query='';filter='all';go('lessons')"><div class="row"><strong>Les ${l}</strong><small>${n}/${ids.length}</small></div><div style="font-size:24px;margin-top:8px">${ids.slice(0,7).map(i=>DATA[i][1]).join(' ')}</div>${bar(n,ids.length)}</button>`}).join('');}else if(tab==='lessons'){app.innerHTML=`<h2>Karakters</h2><div class="filters"><input id="search" placeholder="Zoek Hanzi, pinyin of Engels" value="${esc(query)}"><select id="lesson"><option value="0">Alle lessen</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${lesson===i+1?'selected':''}>Les ${i+1}</option>`).join('')}</select><select id="filter"><option value="all">Alle statussen</option><option value="todo" ${filter==='todo'?'selected':''}>Nog te leren</option><option value="done" ${filter==='done'?'selected':''}>Beheerst</option></select></div><div id="results"></div>`;document.getElementById('search').oninput=e=>{query=e.target.value;list()};document.getElementById('lesson').onchange=e=>{lesson=+e.target.value;list()};document.getElementById('filter').onchange=e=>{filter=e.target.value;list()};list();}else if(tab==='practice'){practice()}else{app.innerHTML=`<h2>Instellingen</h2><section class="card"><h3>Je voortgang</h3><p>Je resultaten worden lokaal op dit toestel opgeslagen. Exporteer regelmatig een reservekopie.</p><button onclick= function list(){let q=query.toLowerCase().trim(),ids=all.filter(i=>(!lesson||DATA[i][0]===lesson)&&(!q||DATA[i].slice(1).join(' ').toLowerCase().includes(q))&&(filter==='all'||(filter==='done'?mastered(i):!mastered(i))));document.getElementById('results').innerHTML=`<p class="muted">${ids.length} karakters</p>`+ids.map(i=>{let [l,h,p,m]=DATA[i];return `<section class="card"><div class="row"><div><span class="han">${h}</span> <strong>${esc(p)}</strong><div class="muted">${esc(m)}</div></div><button onclick="speak(${i})" aria-label="Uitspraak">🔊</button></div><small>Les ${l}</small>${skills.map((s,k)=>`<div class="skill"><small>${s}</small><select aria-label="${s}" data-status="${get(i)[k]}" style="width:100%" onchange="set(${i},${k},+this.value);this.dataset.status=this.value;if(filter!=='all')list()">${statuses.map((x,v)=>`<option value="${v}" ${get(i)[k]===v?'selected':''}>${x}</option>`).join('')}</select></div>`).join('')}</section>`}).join('')}
function speak(i){if(!('speechSynthesis' in window)){alert('Uitspraak is niet beschikbaar.');return}let u=new SpeechSynthesisUtterance(DATA[i][1]);u.lang='zh-CN';u.rate=.8;let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('zh-cn'));if(voice)u.voice=voice;speechSynthesis.cancel();speechSynthesis.speak(u)}
function start(){mode=document.getElementById('mode').value;let l=+document.getElementById('pl').value,only=document.getElementById('only').checked,k=mode==='recognize'?0:mode==='pronounce'?1:2;pool=all.filter(i=>(!l||DATA[i][0]===l)&&(!only||get(i)[k]!==3));for(let i=pool.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}pos=0;revealed=false;practice()}
function practice(){if(!pool.length||pos>=pool.length){app.innerHTML=`<h2>${pool.length?'Ronde voltooid!':'Oefenen'}</h2><section class="card"><p>Kies wat je wilt oefenen.</p><select id="mode" style="width:100%"><option value="recognize">Herkennen · Hanzi → betekenis</option><option value="pronounce">Uitspreken · Hanzi → pinyin</option><option value="write">Schrijven · betekenis → Hanzi</option></select><p><select id="pl" style="width:100%"><option value="0">Alle lessen</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}">Les ${i+1}</option>`).join('')}</select></p><p><label><input id="only" type="checkbox" checked> Alleen nog niet beheerste karakters</label></p><button class="active" onclick="start()">Start oefenronde</button></section>`;return}let i=pool[pos],[l,h,p,m]=DATA[i];app.innerHTML=`<div class="row"><small>${pos+1} / ${pool.length} · Les ${l}</small><button onclick="pool=[];practice()">Stop</button></div>${bar(pos,pool.length)}<section class="card practice"><small>${mode==='write'?'Schrijf het karakter':mode==='pronounce'?'Wat is de pinyin?':'Wat betekent dit?'}</small>${mode==='write'?`<h2>${esc(m)}</h2><p>${esc(p)}</p><div class="canvaswrap"><canvas id="pad" width="640" height="640"></canvas></div><button onclick="clearPad()">Wis schrijfvlak</button>`:`<div class="han">${h}</div>`}<div id="answer" ${revealed?'':'class="hidden"'}><div class="han" style="font-size:60px">${h}</div><h2>${esc(p)}</h2><p>${esc(m)}</p><button onclick="speak(${i})">🔊 Luister</button></div><div id="rating" ${revealed?'':'class="hidden"'}><p>Hoe goed kende je het?</p><button onclick="rate(1)">Nog niet</button><button onclick="rate(2)">Bijna</button><button class="active" onclick="rate(3)">Beheerst</button></div><button id="reveal" class="active ${revealed?'hidden':''}" onclick="revealed=true;document.getElementById('answer').classList.remove('hidden');document.getElementById('rating').classList.remove('hidden');this.classList.add('hidden')">Toon antwoord</button></section><p class="hint">Beoordeel jezelf na het bekijken van het antwoord. Schrijftraining wordt niet automatisch gecorrigeerd.</p>`;if(mode==='write')initPad()}
function rate(v){set(pool[pos],mode==='recognize'?0:mode==='pronounce'?1:2,v);pos++;revealed=false;practice()}function clearPad(){let c=document.getElementById('pad'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.strokeStyle='#c9cec5';x.lineWidth=2;x.setLineDash([9,9]);x.beginPath();x.moveTo(320,0);x.lineTo(320,640);x.moveTo(0,320);x.lineTo(640,320);x.stroke();x.setLineDash([])}function initPad(){let c=document.getElementById('pad'),x=c.getContext('2d'),down=false;clearPad();function point(e){let r=c.getBoundingClientRect();return [(e.clientX-r.left)*640/r.width,(e.clientY-r.top)*640/r.height]}c.onpointerdown=e=>{down=true;c.setPointerCapture(e.pointerId);x.strokeStyle='#17291f';x.lineWidth=12;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(...point(e));x.lineTo(...point(e));x.stroke()};c.onpointermove=e=>{if(down){x.lineTo(...point(e));x.stroke()}};c.onpointerup=c.onpointercancel=()=>down=false}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(saved)],{type:'application/json'}));a.download='hanzi-voortgang.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(e){try{let d=JSON.parse(await e.target.files[0].text());if(!d||Array.isArray(d)||typeof d!=='object'||!Object.entries(d).every(([k,v])=>/^\d+$/.test(k)&&+k<DATA.length&&Array.isArray(v)&&v.length===3&&v.every(n=>Number.isInteger(n)&&n>=0&&n<=3)))throw Error();saved=d;localStorage.setItem(KEY,JSON.stringify(saved));alert('Voortgang geïmporteerd.');render()}catch(e){alert('Ongeldige reservekopie.')}}document.getElementById('nav').onclick=e=>{if(e.target.dataset.tab)go(e.target.dataset.tab)};render();setInterval(refreshGreeting,60000);document.addEventListener('visibilitychange',refreshGreeting);if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
