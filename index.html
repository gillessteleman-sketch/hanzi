nme míngzi?", "What is your name?"], ["Adjective predicates", "Use subject + 很 + adjective without 是. Negate with 不. 都 and 也 precede the predicate.", "他们都很忙。", "Tāmen dōu hěn máng.", "They are all busy."], ["Nationality", "Country + 人 expresses nationality; 们 marks plural people and personal pronouns.", "我是比利时人。", "Wǒ shì Bǐlìshí rén.", "I am Belgian."]], "vocab": [["叫", "jiào", "to be called"], ["名字", "míngzi", "name"], ["什么", "shénme", "what"], ["中国", "Zhōngguó", "China"], ["比利时", "Bǐlìshí", "Belgium"], ["英国", "Yīngguó", "United Kingdom"], ["德国", "Déguó", "Germany"], ["法国", "Fǎguó", "France"], ["美国", "Měiguó", "USA"], ["人", "rén", "person"], ["高兴", "gāoxìng", "happy"], ["忙", "máng", "busy"], ["漂亮", "piàoliang", "beautiful"], ["帅", "shuài", "handsome"], ["高", "gāo", "tall"], ["矮", "ǎi", "short"], ["大", "dà", "big"], ["小", "xiǎo", "small"], ["都", "dōu", "all"], ["我们", "wǒmen", "we"], ["你们", "nǐmen", "you plural"], ["他们", "tāmen", "they"]], "questions": [["We are all happy.", ["我们", "都", "很", "高兴"], "Wǒmen dōu hěn gāoxìng."], ["What nationality are you?", ["你", "是", "哪", "国", "人"], "Nǐ shì nǎ guó rén?"]]}, {"unit": 4, "week": 2, "topic": "Identity, location, possession", "grammar": [["是 versus 在", "是 identifies a person or thing; 在 states where something is. Question words occupy the answer slot.", "老师在哪儿？", "Lǎoshī zài nǎr?", "Where is the teacher?"], ["Possession", "Possessor + 的 + noun. 的 may be omitted with close relationships, for example 我妈妈.", "这是我的书。", "Zhè shì wǒ de shū.", "This is my book."], ["Tone changes", "Two consecutive third tones: the first is pronounced with a rising tone. 不 becomes bú before a fourth tone.", "你好，不是。", "Nǐ hǎo, bú shì.", "Hello; is not."]], "vocab": [["在", "zài", "to be at"], ["的", "de", "possessive particle"], ["谁", "shéi", "who"], ["哪儿", "nǎr", "where"], ["那儿", "nàr", "there"], ["这儿", "zhèr", "here"], ["哪", "nǎ", "which"], ["那", "nà", "that"], ["这", "zhè", "this"], ["书", "shū", "book"], ["朋友", "péngyou", "friend"], ["同学", "tóngxué", "classmate"], ["汉语", "Hànyǔ", "Chinese language"]], "questions": [["My friend is in China.", ["我的", "朋友", "在", "中国"], "Wǒ de péngyou zài Zhōngguó."], ["Who is your teacher?", ["谁", "是", "你的", "老师"], "Shéi shì nǐ de lǎoshī?"]]}, {"unit": 5, "week": 3, "topic": "Numbers, family and age", "grammar": [["Numbers", "11–19: 十 + digit. Multiples of ten: digit + 十. 百 and 千 denote hundreds and thousands.", "二百零五。", "Èrbǎi líng wǔ.", "205."], ["Family and classifiers", "家 + 有 + number + 口 + 人 counts household members. 几 typically asks about small quantities.", "我家有四口人。", "Wǒ jiā yǒu sì kǒu rén.", "There are four people in my family."], ["Age", "Use number + 岁, usually without 是. 多大 is a general age question; 几岁 is often used for children.", "我今年十九岁。", "Wǒ jīnnián shíjiǔ suì.", "I am nineteen this year."]], "vocab": [["零", "líng", "zero"], ["一", "yī", "one"], ["二", "èr", "two"], ["三", "sān", "three"], ["四", "sì", "four"], ["五", "wǔ", "five"], ["六", "liù", "six"], ["七", "qī", "seven"], ["八", "bā", "eight"], ["九", "jiǔ", "nine"], ["十", "shí", "ten"], ["百", "bǎi", "hundred"], ["千", "qiān", "thousand"], ["家", "jiā", "home"], ["有", "yǒu", "have"], ["口", "kǒu", "household classifier"], ["几", "jǐ", "how many"], ["岁", "suì", "years old"], ["今年", "jīnnián", "this year"], ["爸爸", "bàba", "father"], ["妈妈", "māma", "mother"], ["哥哥", "gēge", "older brother"], ["弟弟", "dìdi", "younger brother"], ["姐姐", "jiějie", "older sister"], ["妹妹", "mèimei", "younger sister"], ["爷爷", "yéye", "paternal grandfather"], ["奶奶", "nǎinai", "paternal grandmother"], ["外公", "wàigōng", "maternal grandfather"], ["外婆", "wàipó", "maternal grandmother"], ["父母", "fùmǔ", "parents"], ["儿子", "érzi", "son"], ["女儿", "nǚ'ér", "daughter"]], "questions": [["How many people are in your family?", ["你家", "有", "几", "口", "人"], "Nǐ jiā yǒu jǐ kǒu rén?"], ["My sister is twenty years old.", ["我姐姐", "二十", "岁"], "Wǒ jiějie èrshí suì."]]}, {"unit": 6, "week": 4, "topic": "Verbs, abilities and classifiers", "grammar": [["会 and verb-object combinations", "会 precedes the action when expressing learned ability. Many Chinese activities have a conventional object, like 吃饭 or 看书.", "我会写汉字。", "Wǒ huì xiě Hànzì.", "I can write Chinese characters."], ["A-not-A questions", "Repeat the verb with 不 between the two forms; do not also use 吗. An object known in context can be omitted.", "你会不会说汉语？", "Nǐ huì bu huì shuō Hànyǔ?", "Can you speak Chinese?"], ["Classifiers and derived adjectives", "Number or demonstrative + classifier + noun. 本 for books, 个 for many general nouns, 杯 for cups. 好 + verb may describe quality.", "这本书很好看。", "Zhè běn shū hěn hǎokàn.", "This book is enjoyable to read."]], "vocab": [["会", "huì", "know how to"], ["说", "shuō", "speak"], ["写", "xiě", "write"], ["读", "dú", "read"], ["看", "kàn", "look or read"], ["吃", "chī", "eat"], ["听", "tīng", "listen"], ["做", "zuò", "do or make"], ["汉字", "Hànzì", "Chinese characters"], ["语言", "yǔyán", "language"], ["话", "huà", "speech"], ["中文", "Zhōngwén", "Chinese"], ["饭", "fàn", "meal"], ["菜", "cài", "dish"], ["听歌", "tīng gē", "listen to songs"], ["好吃", "hǎochī", "tasty"], ["好看", "hǎokàn", "good-looking"], ["本", "běn", "book classifier"], ["个", "gè", "general classifier"], ["杯", "bēi", "cup classifier"], ["哪个", "nǎ ge", "which one"]], "questions": [["I cannot write Chinese characters.", ["我", "不", "会", "写", "汉字"], "Wǒ bú huì xiě Hànzì."], ["Which book is good to read?", ["哪", "本", "书", "很", "好看"], "Nǎ běn shū hěn hǎokàn?"]]}, {"unit": 7, "week": 5, "topic": "Dates, movement and word order", "grammar": [["怎么", "Place 怎么 before the verb to ask about the method of an action.", "你怎么读这个字？", "Nǐ zěnme dú zhège zì?", "How do you read this character?"], ["Time placement", "Time may come before or immediately after the subject. It precedes the main action. Dates proceed from larger units to smaller units.", "我明天去学校。", "Wǒ míngtiān qù xuéxiào.", "I go to school tomorrow."], ["Serial verbs", "去 or 来 + destination + purpose/action. The main action follows the movement phrase.", "我去商店买茶。", "Wǒ qù shāngdiàn mǎi chá.", "I go to the shop to buy tea."]], "vocab": [["今天", "jīntiān", "today"], ["昨天", "zuótiān", "yesterday"], ["明天", "míngtiān", "tomorrow"], ["星期", "xīngqī", "week"], ["星期一", "xīngqīyī", "Monday"], ["星期二", "xīngqī'èr", "Tuesday"], ["星期三", "xīngqīsān", "Wednesday"], ["星期四", "xīngqīsì", "Thursday"], ["星期五", "xīngqīwǔ", "Friday"], ["星期六", "xīngqīliù", "Saturday"], ["星期日", "xīngqīrì", "Sunday"], ["周末", "zhōumò", "weekend"], ["月", "yuè", "month"], ["号", "hào", "date number"], ["生日", "shēngrì", "birthday"], ["怎么", "zěnme", "how"], ["去", "qù", "go"], ["来", "lái", "come"], ["回", "huí", "return"], ["学校", "xuéxiào", "school"], ["商店", "shāngdiàn", "shop"], ["茶", "chá", "tea"], ["咖啡", "kāfēi", "coffee"], ["米饭", "mǐfàn", "cooked rice"], ["水", "shuǐ", "water"], ["喝", "hē", "drink"], ["买", "mǎi", "buy"]], "questions": [["Tomorrow we all go to school.", ["明天", "我们", "都", "去", "学校"], "Míngtiān wǒmen dōu qù xuéxiào."], ["I go to the shop to buy apples.", ["我", "去", "商店", "买", "苹果"], "Wǒ qù shāngdiàn mǎi píngguǒ."]]}, {"unit": 8, "week": 6, "topic": "Wishes, quantity and shopping", "grammar": [["想, 要, 会", "想 often expresses desire or thinking, 要 a want or intention, 会 ability or predicted future. The precise meaning depends on context.", "我想喝茶。", "Wǒ xiǎng hē chá.", "I would like to drink tea."], ["多, 多少, 几", "多 + adjective asks degree. 几 + classifier + noun usually asks a small count. 多少 asks an unknown count or price; a classifier is sometimes omitted.", "你有多少本书？", "Nǐ yǒu duōshao běn shū?", "How many books do you have?"], ["Approximate quantities", "With a small number and a unit, 多 can follow the classifier for a fractional amount (三个多月). With a round larger number, 多 precedes the classifier (二十多个人).", "我有二十多本书。", "Wǒ yǒu èrshí duō běn shū.", "I have more than twenty books."]], "vocab": [["想", "xiǎng", "want or miss"], ["要", "yào", "want or need"], ["需要", "xūyào", "need"], ["多少", "duōshao", "how many"], ["多", "duō", "many"], ["少", "shǎo", 桌子", "下", "有", "一只", "猫"], "Zhuōzi xià yǒu yì zhī māo."], ["My father works in the hospital.", ["我爸爸", "在", "医院", "工作"], "Wǒ bàba zài yīyuàn gōngzuò."]]}, {"unit": 10, "week": 8, "topic": "Ability, possibility and permission", "grammar": [["会 / 能 / 可以", "会 usually expresses a learned skill. 能 expresses capacity or circumstances. 可以 commonly expresses permission; meanings overlap in some contexts.", "我今天不能去学校。", "Wǒ jīntiān bù néng qù xuéxiào.", "I cannot go to school today."], ["和 and 也", "和 coordinates nouns; 也 adds a parallel statement and comes before the predicate.", "我和妈妈都喜欢茶。", "Wǒ hé māma dōu xǐhuan chá.", "My mother and I both like tea."], ["Polite requests", "Use 请 for requests; 能 or 可以 with 吗 to ask permission.", "请问，我可以坐在这儿吗？", "Qǐngwèn, wǒ kěyǐ zuò zài zhèr ma?", "Excuse me, may I sit here?"]], "vocab": [["能", "néng", "be able to"], ["可以", "kěyǐ", "may"], ["坐", "zuò", "sit"], ["和", "hé", "and"], ["请问", "qǐngwèn", "excuse me"], ["电脑", "diànnǎo", "computer"], ["电影", "diànyǐng", "movie"], ["电视", "diànshì", "television"], ["电话", "diànhuà", "telephone"], ["电池", "diànchí", "battery"], ["电车", "diànchē", "tram"], ["电书", "diànshū", "e-book"], ["有电", "yǒu diàn", "have electricity"], ["没有电", "méiyǒu diàn", "no electricity"], ["医生", "yīshēng", "doctor"], ["开车", "kāichē", "drive"], ["因为", "yīnwèi", "because"], ["所以", "suǒyǐ", "therefore"]], "questions": [["Can I sit here?", ["我", "可以", "坐在", "这儿", "吗"], "Wǒ kěyǐ zuò zài zhèr ma?"], ["Because I have no car, I cannot drive.", ["因为", "我", "没有", "车", "所以", "我", "不能", "开车"], "Yīnwèi wǒ méiyǒu chē, suǒyǐ wǒ bù néng kāichē."]]}, {"unit": 11, "week": 8, "topic": "Clock and relative time", "grammar": [["Reading the clock", "Number + 点 + minutes + 分. 半 means half past; 两点 is two o’clock. Time goes largest to smallest.", "现在下午两点半。", "Xiànzài xiàwǔ liǎng diǎn bàn.", "It is now 2:30 p.m."], ["Time before the verb", "Put time before the subject or after the subject, before the action.", "我明天早上八点去学校。", "Wǒ míngtiān zǎoshang bā diǎn function strokePage(i=0){writeIdx=i;const [l,h,p,m]=DATA[i];const token=++writeToken;app.innerHTML=`${btn('‹ Leren','learn()')}<section class="card practice"><small>STROKE ORDER · LES ${l}</small><select id="strokeSelect" onchange="strokePage(+this.value)" style="width:100%">${DATA.map((d,j)=>`<option value="${j}" ${i===j?'selected':''}>${d[1]} · ${esc(d[2])} · ${esc(d[3])}</option>`).join('')}</select><h2>${esc(p)} · ${esc(m)}</h2><div id="strokeTarget" class="strokeTarget" aria-label="Schrijfvlak"></div><p id="strokeStatus" class="hint">Stroke-data laden…</p><div class="tokenarea">${btn('Demonstratie','strokeAction(0)')}${btn('Overtrekken','strokeAction(1)')}${btn('Uit het hoofd','strokeAction(2)')}${btn('Reset','strokePage(writeIdx)')}</div><div class="row"><button ${i===0?'disabled':''} onclick="strokePage(writeIdx-1)">‹ Vorige</button><button ${i===DATA.length-1?'disabled':''} onclick="strokePage(writeIdx+1)">Volgende ›</button></div></section><p class="hint">Stroke order via Hanzi Writer (online). De schrijfscore wordt alleen opgeslagen na een geslaagde oefening en jouw bevestiging.</p>`;writer=null;if(!window.HanziWriter){document.getElementById('strokeStatus').textContent='Hanzi Writer kon niet laden. Gebruik voorlopig de gewone schrijfoefening.';return}try{writer=HanziWriter.create('strokeTarget',h,{width:280,height:280,padding:12,strokeColor:'#203c30',outlineColor:'#9daea1',highlightColor:'#4b9874',showOutline:true,showCharacter:true,onLoadCharDataSuccess:()=>{if(token===writeToken&&document.getElementById('strokeStatus'))document.getElementById('strokeStatus').textContent='Kies een oefenmodus.'},onLoadCharDataError:()=>{if(token===writeToken&&document.getElementById('strokeStatus'))document.getElementById('strokeStatus').textContent='Stroke-data niet beschikbaar. Controleer je verbinding.'}})}catch(e){document.getElementById('strokeStatus').textContent=e.message}}
function strokeAction(k){if(!writer)return;writer.cancelQuiz();if(k===0){writer.showCharacter();writer.showOutline();writer.animateCharacter();return}writer.hideCharacter();if(k===1)writer.showOutline();else writer.hideOutline();let token=writeToken,i=writeIdx;writer.quiz({showHintAfterMisses:k===1?2:false,highlightOnComplete:true,onMistake:d=>{let el=document.getElementById('strokeStatus');if(el&&token===writeToken)el.textContent='Probeer streek '+(d.strokeNum+1)+' opnieuw.'},onComplete:d=>{let el=document.getElementById('strokeStatus');if(el&&token===writeToken){el.textContent=`Voltooid · ${d.totalMistakes} fouten`;if(k===2&&d.totalMistakes===0){let b=document.createElement('button');b.textContent='Opslaan als beheerst';b.className='active';b.onclick=async()=>{if(await set(i,2,3))b.textContent='Opgeslagen ✓'};el.append(' ',b)}}}})}
let audioUrls=[];function listenPage(){audioUrls.forEach(URL.revokeObjectURL);audioUrls=[];app.innerHTML=`${btn('‹ Leren','learn()')}<div class="greeting"><h2>听力 · Luisteren</h2><p>Importeer je eigen HSK-audiobestanden.</p></div><section class="card"><label>MP3-bestanden selecteren<input type="file" accept="audio/*,.mp3" multiple onchange="loadAudio(this.files)"></label><p class="hint">Audio blijft lokaal in deze sessie, wordt niet naar GitHub of Supabase gestuurd. Selecteer de bestanden opnieuw na herladen.</p><div id="audiofiles"></div></section><section class="card"><h3>Luistertraining zonder MP3</h3><p>Laat een Chinese modelzin voorlezen en vertaal ze.</p>${btn('Nieuwe luistervraag','listenQuestion()','active')}<div id="lq"></div></section>`}
function loadAudio(files){audioUrls.forEach(URL.revokeObjectURL);audioUrls=[];document.getElementById('audiofiles').innerHTML='';for(const f of files){let url=URL.createObjectURL(f);audioUrls.push(url);let el=document.createElement('section');el.className='audioitem';let t=document.createElement('p');t.textContent=f.name;let a=document.createElement('audio');a.controls=true;a.src=url;a.preload='metadata';let sel=document.createElement('select');for(const r of [.5,.75,1,1.25,1.5])sel.add(new Option(r+'×',r,r===1,r===1));sel.onchange=()=>a.playbackRate=+sel.value;let label=document.createElement('label'),cb=document.createElement('input');cb.type='checkbox';cb.onchange=()=>a.loop=cb.checked;label.append(cb,' Herhalen');el.append(t,a,sel,label);document.getElementById('audiofiles').append(el)}}

let rec=null,recStream=null,recUrl=null;function speakPage(){app.innerHTML=`${btn('‹ Leren','learn()')}<div class="greeting"><h2>口语 · Spreken</h2><p>Beantwoord vragen hardop en luister jezelf terug.</p></div><section class="card"><div id="speakingPrompt"></div>${btn('Nieuwe vraag','speakingPrompt()')}<div class="tokenarea"><button id="recStart" onclick="recordStart()">● Opnemen</button><button id="recStop" disabled onclick="recordStop()">Stop</button></div><div id="recording"></div><p class="hint">Opnames blijven in je browser. Geen automatische uitspraakbeoordeling.</p></section>`;speakingPrompt()}
const PROMPTS=[['你叫什么名字？','Nǐ jiào shénme míngzi?','What is your name?'],['你家有几口人？','Nǐ jiā yǒu jǐ kǒu rén?','How many people are in your family?'],['你喜欢做什么？','Nǐ xǐhuan zuò shénme?','What do you like doing?'],['你在哪儿学习？','Nǐ zài nǎr xuéxí?','Where do you study?'],['今天天气怎么样？','Jīntiān tiānqì zěnmeyàng?','How is the weather today?'],['你是怎么来的？','Nǐ shì zěnme lái de?','How did you get here?']];function speakingPrompt(){let [h,p,en]=shuffle(PROMPTS)[0];document.getElementById('speakingPrompt').innerHTML=`<div class="example"><span>${h}</span><p>${p}</p><small>${en}</small></div><button data-text="${h}" onclick="sayText(this.dataset.text)">♪ Listen</button>`}async function recordStart(){try{if(!navigator.mediaDevices||!window.MediaRecorder)throw Error('Microfoonopname niet ondersteund.');recStream=await navigator.mediaDevices.getUserMedia({audio:true});if(!document.getElementById('recStart')){recStream.getTracks().forEach(t=>t.stop());return}let chunks=[];rec=new MediaRecorder(recStream);rec.ondataavailable=e=>chunks.push(e.data);rec.onstop=()=>{recStream?.getTracks().forEach(t=>t.stop());if(recUrl)URL.revokeObjectURL(recUrl);let el=document.getElementById('recording');if(el){recUrl=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));let a=document.createElement('audio');a.controls=true;a.src=recUrl;el.replaceChildren(a)}if(document.getElementById('recStart')){document.getElementById('recStart').disabled=false;document.getElementById('recStop').disabled=true}};rec.start();document.getElementById('recStart').disabled=true;document.getElementById('recStop').disabled=false}catch(e){recStream?.getTracks().forEach(t=>t.stop());alert(e.message)}}function recordStop(){if(rec?.state==='recording')rec.stop()}
